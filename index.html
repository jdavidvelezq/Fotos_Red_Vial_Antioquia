<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotos Red Vial Antioquia - Módulo de Carga</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="container">
      <h1>Fotos Red Vial Antioquia</h1>
      <p>Módulo de Carga e Inventario Fotográfico</p>
    </div>
  </header>

  <main class="container">
    <!-- Selector de Archivos -->
    <section class="selector-box">
      <h2>Seleccionar Fotografías de Inspección</h2>
      <p>Formatos aceptados: JPG, PNG, WEBP (hasta 20 MB por archivo)</p>
      <label for="filePicker" class="btn-select">Examinar Archivos</label>
      <input type="file" id="filePicker" multiple accept="image/jpeg,image/png,image/webp" />
    </section>

    <!-- Barra de Control -->
    <section class="action-bar">
      <span id="selectedCount">0 fotos seleccionadas</span>
      <button id="btnUpload" class="btn-upload" disabled>SUBIR FOTOGRAFÍAS</button>
    </section>

    <!-- Listado de tarjetas de fotografías -->
    <section id="photoGrid" class="photo-grid"></section>

    <!-- Resumen posterior a la carga -->
    <section id="summarySection" style="display: none;"></section>
  </main>

  <!-- Inyección de módulos JavaScript -->
  <script src="config/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
